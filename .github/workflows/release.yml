name: Manage Release Branch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Version/Release name (e.g. v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  push-to-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: onlineide
          fetch-depth: 0

      - name: Push to release branch
        run: |
          git fetch origin
          
          if [ "${{ github.event_name }}" = "release" ]; then
            release_version="${{ github.event.release.tag_name }}"
          else
            release_version="${{ github.event.inputs.release_name }}"
          fi
          
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Write version to VERSION file
          echo "$release_version" > VERSION
          
          # Commit the updated VERSION file to onlineide branch
          git add VERSION
          git commit -m "chore: update VERSION to $release_version [skip ci]" --allow-empty
          git push origin HEAD:refs/heads/onlineide
          
          # Force-push this commit directly to the release branch
          git push origin HEAD:refs/heads/release --force

