name: (on PR sync) Set PR Description

on: 
  pull_request:
    types: [synchronize]
  # Manual trigger (Actions tab → Run workflow).
  workflow_dispatch:

jobs:
  update-pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set PR description from Copilot comment (fallback to summary)
      env:
        GH_TOKEN: ${{ secrets.GH_TOK }}
      run: |
        set -euo pipefail
        # Determine PR number
        PR_NUMBER="${{ github.event.pull_request.number || '' }}"
        if [ -z "$PR_NUMBER" ]; then
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          PR_NUMBER=$(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName==\"${BRANCH_NAME}\") | .number" || true)
        fi
        if [ -z "$PR_NUMBER" ]; then
          echo "Could not determine PR number. Exiting."
          exit 0
        fi

        # Try to find a Copilot-generated comment on the PR (most recent)
        COMMENTS_JSON=$(gh api repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments --jq '.' || true)
        COPILOT_BODY=$(printf '%s' "$COMMENTS_JSON" | jq -r '.[] | select(.user.login|test("copilot";"i")) | .body' 2>/dev/null | sed -n '$p' || true)
        # If the above heuristic missed Copilot, search for comments containing 'overview' or 'summary'
        if [ -z "$COPILOT_BODY" ]; then
          COPILOT_BODY=$(printf '%s' "$COMMENTS_JSON" | jq -r '.[] | select(.body|test("(?i)overview|summary|pull request overview|copilot")) | .body' 2>/dev/null | sed -n '$p' || true)
        fi

        if [ -n "$COPILOT_BODY" ]; then
          # Use the Copilot comment verbatim as PR description
          printf "%s" "$COPILOT_BODY" > pr_description.txt
          gh pr edit "$PR_NUMBER" --body-file pr_description.txt
          echo "Set PR description from Copilot comment."
          exit 0
        fi

        # Fallback: synthesize a short 4-line description (previous behavior)
        commits=$(gh pr view "$PR_NUMBER" --json commits --jq '.commits[].commit.message' || true)
        first_commit=$(printf "%s" "$commits" | sed -n '1p' | tr '\n' ' ' | sed 's/  */ /g' | sed 's/^\s*//;s/\s*$//')
        files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' || true)
        num_files=$(printf "%s" "$files" | sed '/^$/d' | wc -l | tr -d ' ')
        top_files=$(printf "%s" "$files" | sed -n '1,5p' | tr '\n' ', ' | sed 's/, $//')
        topics=$(printf "%s" "$commits" "$files" | grep -Eio 'manifest|favicon|icon|apple-touch|service worker|sw-|pwa' || true | tr '\n' ', ' | sed 's/, $//')
        if [ -z "$topics" ]; then topics="general updates"; fi
        line1=$(printf "%s" "${first_commit:-Update project files}" )
        line2=$(printf "Modifies %s file(s); top files: %s" "$num_files" "${top_files:-none}" )
        line3=$(printf "Primary changes: %s" "$topics")
        line4="See PR for details and discussion."
        # Do NOT include B2J_CHANGELOG.MD in PR descriptions (irrelevant information)
        printf "%s\n\n%s\n%s\n\n%s\n" "$line1" "$line2" "$line3" "$line4" > pr_description.txt
        gh pr edit "$PR_NUMBER" --body-file pr_description.txt