name: Build and Deploy Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: b2j-dev

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.DOCKER_REGISTRY != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (sha + :dev)
        run: |
          set -e
          REGISTRY="${{ vars.DOCKER_REGISTRY }}"
          IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_NAME" ]; then
            echo "ERROR: DOCKER_REGISTRY and DOCKER_IMAGE vars must be set" >&2
            exit 1
          fi
          FULL_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:${{ github.sha }}"
          TMP_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:dev"
          DOCKER_BUILDKIT=1 docker build --pull --no-cache --build-arg SKIP_ONLINE_IDE_BUILD=1 -t "$FULL_IMAGE" -t "$TMP_IMAGE" .
          docker push "$FULL_IMAGE"
          docker push "$TMP_IMAGE"

      - name: Deploy on server via SSH (pull image and restart container)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            REGISTRY="${{ vars.DOCKER_REGISTRY }}"
            IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${{ github.sha }}"

            echo "SSH connected to: $(hostname)";
            uname -a || true

            if [ -z "$REGISTRY" ]; then
              echo "ERROR: var DOCKER_REGISTRY must be set" >&2
              exit 1
            fi
            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: var DOCKER_IMAGE must be set" >&2
              exit 1
            fi

            CONTAINER_NAME="${{ vars.DEPLOY_CONTAINER_NAME }}"
            if [ -z "$CONTAINER_NAME" ]; then
              echo "ERROR: secret DEPLOY_CONTAINER_NAME must be set" >&2
              exit 1
            fi

            TMP_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:dev"
            docker pull "$TMP_IMAGE" || true

            if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker stop "$CONTAINER_NAME" || true
            fi
            if docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker rm "$CONTAINER_NAME" || true
            fi

            PORT="${{ vars.DEPLOY_APP_PORT }}"
            PORT=${PORT:-8080}

            docker run -d --restart unless-stopped --name "$CONTAINER_NAME" -p 127.0.0.1:${PORT}:${PORT} -e NODE_ENV=production -e PORT=${PORT} "$TMP_IMAGE"

            APP_OK=0
            for i in $(seq 1 10); do
              if curl -sSf http://127.0.0.1:${PORT}/ >/dev/null 2>&1; then
                APP_OK=1; break
              fi
              sleep 1
            done
            if [ "$APP_OK" -ne 1 ]; then
              echo "ERROR: app did not respond on container port ${PORT}" >&2
              docker logs --tail 500 "$CONTAINER_NAME" >&2 || true
              docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
              exit 1
            fi
            docker push "$TMP_IMAGE"

      - name: Deploy on server via SSH (pull image and restart container)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            REGISTRY="${{ vars.DOCKER_REGISTRY }}"
            IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${{ github.sha }}"

            # Quick remote checks to validate SSH session and environment
            echo "SSH connected to: $(hostname)";
            uname -a || true
            if command -v docker >/dev/null 2>&1; then docker --version || true; else echo "docker not installed"; fi
            if command -v nginx >/dev/null 2>&1; then nginx -v || true; else echo "nginx not installed yet"; fi

            # Hostname for deploy (provided as a repo var)
            HOST="${{ vars.DEPLOY_HOST }}"
            HOST=${HOST:-_}

            if [ -z "$REGISTRY" ]; then
              echo "ERROR: var DOCKER_REGISTRY must be set" >&2
              exit 1
            fi
            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: var DOCKER_IMAGE must be set" >&2
              exit 1
            fi


            # Log in to container registry if credentials are provided
            # REGISTRY_USERNAME="${{ secrets.REGISTRY_USERNAME }}"
            # REGISTRY_PASSWORD="${{ secrets.REGISTRY_PASSWORD }}"
            #if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            #  echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            #else
            #  echo "No registry credentials provided; assuming server is already logged into $REGISTRY" >&2
            #fi

            CONTAINER_NAME="${{ vars.DEPLOY_CONTAINER_NAME }}"
            if [ -z "$CONTAINER_NAME" ]; then
              echo "ERROR: secret DEPLOY_CONTAINER_NAME must be set" >&2
              exit 1
            fi

            # Pull latest image (sha) and the :dev tag, then tag :dev locally as b2j-dev:dev
            TMP_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:dev"
            docker pull "$TMP_IMAGE" || true

            # Stop and remove existing container
            if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker stop "$CONTAINER_NAME" || true
            fi
            if docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker rm "$CONTAINER_NAME" || true
            fi

            # Choose internal port
            PORT="${{ vars.DEPLOY_APP_PORT }}"
            PORT=${PORT:-8080}

            # Run container bound to localhost (pass PORT env so app respects mapping)
            docker run -d --restart unless-stopped --name "$CONTAINER_NAME" -p 127.0.0.1:${PORT}:${PORT} -e NODE_ENV=production -e PORT=${PORT} "$TMP_IMAGE"

            # Health check: verify the app inside the container responds on the chosen port
            APP_OK=0
            for i in $(seq 1 10); do
              if curl -sSf http://127.0.0.1:${PORT}/ >/dev/null 2>&1; then
                APP_OK=1; break
              fi
              sleep 1
            done
            if [ "$APP_OK" -ne 1 ]; then
              echo "ERROR: app did not respond on container port ${PORT}" >&2
              echo "=== last 500 lines of container logs ===" >&2
              docker logs --tail 500 "$CONTAINER_NAME" >&2 || true
              echo "=== container status ===" >&2
              docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
              exit 1
            fi
            # nginx configuration and external proxying are managed outside this workflow
