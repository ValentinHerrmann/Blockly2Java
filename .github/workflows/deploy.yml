name: Build and Deploy Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    
jobs:
  build-ide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install IDE dependencies
        run: |
          cd custom-generator-codelab
          npm ci || npm install

      - name: Build IDE (produces custom-generator-codelab/build)
        run: |
          cd custom-generator-codelab
          npm run build

      - name: Normalize build directory
        run: |
          # Webpack outputs to `dist` for production builds and `build` for dev.
          # Ensure `build` exists so subsequent steps can rely on it.
          if [ -d custom-generator-codelab/dist ] && [ ! -d custom-generator-codelab/build ]; then
            echo "Found dist output, copying to build/..."
            rm -rf custom-generator-codelab/build || true
            mkdir -p custom-generator-codelab/build
            cp -r custom-generator-codelab/dist/* custom-generator-codelab/build/ || true
          fi
          echo "build directory contents:" && ls -la custom-generator-codelab/build || true

      - name: Verify build output
        run: |
          echo "Checking for custom-generator-codelab/build..."
          if [ ! -d custom-generator-codelab/build ]; then
            echo "ERROR: build output missing: custom-generator-codelab/build" >&2
            echo "Repository files:" >&2
            ls -la || true
            echo "custom-generator-codelab files:" >&2
            ls -la custom-generator-codelab || true
            exit 1
          fi

      - name: Upload IDE build artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-ide-build
          path: custom-generator-codelab/build

  build-and-deploy:
    needs: build-ide
    runs-on: ubuntu-latest

    environment: b2j-dev

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download IDE build artifact
        uses: actions/download-artifact@v4
        with:
          name: online-ide-build
          path: online-ide-build

      - name: Place IDE build into repo
        run: |
          if [ -d online-ide-build ]; then
            rm -rf custom-generator-codelab/build || true
            mkdir -p custom-generator-codelab/build
            cp -r online-ide-build/* custom-generator-codelab/build/
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.DOCKER_REGISTRY != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (sha + :tmp)
        run: |
          set -e
          REGISTRY="${{ vars.DOCKER_REGISTRY }}"
          IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_NAME" ]; then
            echo "ERROR: DOCKER_REGISTRY and DOCKER_IMAGE vars must be set" >&2
            exit 1
          fi
          FULL_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:${{ github.sha }}"
          TMP_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:tmp"
          DOCKER_BUILDKIT=1 docker build --pull --no-cache --build-arg SKIP_ONLINE_IDE_BUILD=1 -t "$FULL_IMAGE" -t "$TMP_IMAGE" .
          docker push "$FULL_IMAGE"
          docker push "$TMP_IMAGE"

      - name: Deploy on server via SSH (pull image and restart container)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            REGISTRY="${{ vars.DOCKER_REGISTRY }}"
            IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${{ github.sha }}"

            # Quick remote checks to validate SSH session and environment
            echo "SSH connected to: $(hostname)";
            uname -a || true
            if command -v docker >/dev/null 2>&1; then docker --version || true; else echo "docker not installed"; fi
            if command -v nginx >/dev/null 2>&1; then nginx -v || true; else echo "nginx not installed yet"; fi

            # Hostname for nginx server_name (provided as a repo var)
            HOST="${{ vars.DEPLOY_HOST }}"
            HOST=${HOST:-_}

            # Optional TLS certificate/key paths (repo vars). If set and files exist, nginx will be configured for HTTPS and HTTP->HTTPS redirect.
            TLS_CERT_PATH="${{ vars.DEPLOY_TLS_CERT_PATH }}"
            TLS_KEY_PATH="${{ vars.DEPLOY_TLS_KEY_PATH }}"

            if [ -z "$REGISTRY" ]; then
              echo "ERROR: var DOCKER_REGISTRY must be set" >&2
              exit 1
            fi
            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: var DOCKER_IMAGE must be set" >&2
              exit 1
            fi


            # Log in to container registry if credentials are provided
            # REGISTRY_USERNAME="${{ secrets.REGISTRY_USERNAME }}"
            # REGISTRY_PASSWORD="${{ secrets.REGISTRY_PASSWORD }}"
            #if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            #  echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
            #else
            #  echo "No registry credentials provided; assuming server is already logged into $REGISTRY" >&2
            #fi

            CONTAINER_NAME="${{ vars.DEPLOY_CONTAINER_NAME }}"
            if [ -z "$CONTAINER_NAME" ]; then
              echo "ERROR: secret DEPLOY_CONTAINER_NAME must be set" >&2
              exit 1
            fi

            # Pull latest image (sha) and the :tmp tag, then tag :tmp locally as b2j-dev:tmp
            TMP_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME:tmp"
            docker pull "$TMP_IMAGE" || true

            # Stop and remove existing container
            if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker stop "$CONTAINER_NAME" || true
            fi
            if docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker rm "$CONTAINER_NAME" || true
            fi

            # Choose internal port
            PORT="${{ vars.DEPLOY_APP_PORT }}"
            PORT=${PORT:-8080}

            # Run container bound to localhost
            docker run -d --restart unless-stopped --name "$CONTAINER_NAME" -p 127.0.0.1:${PORT}:${PORT} -e NODE_ENV=production "$TMP_IMAGE"

            # Ensure nginx is installed and configure a reverse proxy to the container
            if ! command -v nginx >/dev/null 2>&1; then
              echo "nginx not found, installing..."
              sudo apt-get update -y
              sudo apt-get install -y nginx
            fi

            NGINX_CONF="/etc/nginx/sites-available/${CONTAINER_NAME}"

            # Write nginx configuration to proxy requests to the local container port
            if [ -n "$TLS_CERT_PATH" ] && [ -n "$TLS_KEY_PATH" ] && [ -f "$TLS_CERT_PATH" ] && [ -f "$TLS_KEY_PATH" ]; then
              echo "Using TLS cert/key: $TLS_CERT_PATH $TLS_KEY_PATH"
              sudo tee "${NGINX_CONF}" > /dev/null <<'EOF'
            server {
              listen 80;
              server_name ${HOST};
              return 301 https://$host$request_uri;
            }

            server {
              listen 443 ssl;
              server_name ${HOST};
              ssl_certificate ${TLS_CERT_PATH};
              ssl_certificate_key ${TLS_KEY_PATH};
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;
              location / {
                proxy_pass http://127.0.0.1:${PORT};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            EOF
            else
              sudo tee "${NGINX_CONF}" > /dev/null <<'EOF'
            server {
              listen 80;
              server_name ${HOST};
              location / {
                proxy_pass http://127.0.0.1:${PORT};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            EOF
            fi

            # Enable site and restart nginx if config is valid
            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/${CONTAINER_NAME}
            sudo nginx -t
            sudo systemctl reload nginx || sudo service nginx restart || true

            # Health checks: first check the app container, then nginx
            APP_OK=0
            for i in $(seq 1 10); do
              if curl -sSf http://127.0.0.1:${PORT}/ >/dev/null 2>&1; then
                APP_OK=1; break
              fi
              sleep 1
            done
            if [ "$APP_OK" -ne 1 ]; then
              echo "ERROR: app did not respond on container port ${PORT}" >&2
              exit 1
            fi

            NG_OK=0
            if [ -n "$TLS_CERT_PATH" ] && [ -n "$TLS_KEY_PATH" ] && [ -f "$TLS_CERT_PATH" ] && [ -f "$TLS_KEY_PATH" ]; then
              for i in $(seq 1 10); do
                if curl -sSf -H "Host: ${HOST}" https://127.0.0.1/ --insecure >/dev/null 2>&1; then
                  NG_OK=1; break
                fi
                sleep 1
              done
            else
              for i in $(seq 1 10); do
                if curl -sSf -H "Host: ${HOST}" http://127.0.0.1/ >/dev/null 2>&1; then
                  NG_OK=1; break
                fi
                sleep 1
              done
            fi
            if [ "$NG_OK" -ne 1 ]; then
              echo "ERROR: nginx did not respond as expected" >&2
              exit 1
            fi
