# Simple workflow for deploying static content to GitHub Pages
name: (manual) Build and Deploy to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-build.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            custom-generator-codelab/package-lock.json
            custom-generator-codelab/online-ide-source/package-lock.json
      
      - name: Generate build cache key
        id: build-cache-key
        run: |
          # Use git commit hashes for source code and hash config files
          # This is fast and reliable - same content = same hash
          
          # Get main repo commit hash for Blockly2Java source
          MAIN_COMMIT=$(git rev-parse HEAD:custom-generator-codelab)
          
          # Get submodule commit hash for OnlineIDE
          SUBMODULE_COMMIT=$(git rev-parse HEAD:custom-generator-codelab/online-ide-source)
          
          # Hash critical config files that affect the build
          CONFIG_HASH=$(cat \
            custom-generator-codelab/package.json \
            custom-generator-codelab/webpack.config.js \
            custom-generator-codelab/online-ide-source/package.json \
            custom-generator-codelab/online-ide-source/vite.config.ts \
            custom-generator-codelab/online-ide-source/vite.config-embedded.ts \
            2>/dev/null | sha256sum | awk '{print $1}')
          
          # Add CNAME if it exists
          CNAME_HASH=$(cat CNAME 2>/dev/null | sha256sum | awk '{print $1}' || echo "none")
          
          # Combine all hashes
          HASH=$(echo "${MAIN_COMMIT}${SUBMODULE_COMMIT}${CONFIG_HASH}${CNAME_HASH}" | sha256sum | awk '{print $1}')
          
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Build cache key: $HASH"
          echo "  Main commit: $MAIN_COMMIT"
          echo "  Submodule commit: $SUBMODULE_COMMIT"
          echo "  Config hash: $CONFIG_HASH"
      
      - name: Cache build artifacts
        id: cache-build
        uses: actions/cache@v4
        with:
          path: custom-generator-codelab/dist
          key: ${{ runner.os }}-build-${{ steps.build-cache-key.outputs.hash }}
      
      - name: Install dependencies
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: npm ci
          
      - name: Build project
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: npm run build:all
      
      - name: Display cache status
        run: |
          if [ "${{ steps.cache-build.outputs.cache-hit }}" == "true" ]; then
            echo "✓ Build artifacts restored from cache - build skipped"
          else
            echo "✓ Project built successfully"
          fi
          ls -lh custom-generator-codelab/dist/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: custom-generator-codelab/dist/
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
