# Deploys to GitHub Pages.
# - main branch  → production environment (github-pages)  → b2j.valentin-herrmann.com
# - other branches → preview environment (preview)          → valentin-herrmann.github.io/Blockly2Java/
name: Build and Deploy to Pages

on:
  # Auto-deploy when main is updated.
  push:
    branches:
      - main
  # Manual trigger from any branch (Actions tab → Run workflow).
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment per target environment; never cancel in-progress.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy:
    # Production deploys use the configured github-pages environment (custom domain).
    # All other branches deploy to the "preview" environment (github.io URL).
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            custom-generator-codelab/package-lock.json
            custom-generator-codelab/online-ide-source/package-lock.json

      - name: Build project
        env:
          CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
          GITHUB_PAGES: 'true'
          # Set CUSTOM_DOMAIN on main so webpack uses publicPath '/' (custom domain).
          # Left empty on other branches so webpack uses publicPath '/Blockly2Java/'
          # (the repo's default github.io URL – no custom domain applied there).
          CUSTOM_DOMAIN: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
        run: |
          npm ci
          npm run build:all

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './custom-generator-codelab/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
