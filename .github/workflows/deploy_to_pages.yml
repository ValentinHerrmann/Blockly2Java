# Deploys to GitHub Pages (production only).
# Triggered by pushes to main or onlineide, or manually from those branches.
name: Build and Deploy to Pages

on:
  push:
    branches:
      - main
      - onlineide
  # Manual trigger (Actions tab → Run workflow).
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; never cancel in-progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            custom-generator-codelab/package-lock.json
            custom-generator-codelab/online-ide-source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get Online-IDE submodule commit hash
        id: ide-hash
        run: echo "hash=$(git rev-parse HEAD:custom-generator-codelab/online-ide-source)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Online-IDE build
        id: ide-cache
        uses: actions/cache@v4
        with:
          path: custom-generator-codelab/public
          key: online-ide-build-${{ steps.ide-hash.outputs.hash }}

      - name: Build Online-IDE submodule (only when changed)
        if: steps.ide-cache.outputs.cache-hit != 'true'
        working-directory: custom-generator-codelab
        run: npm run setup

      - name: Build project
        env:
          CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
          GITHUB_PAGES: 'true'
          CUSTOM_DOMAIN: 'true'
        working-directory: custom-generator-codelab
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './custom-generator-codelab/dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
