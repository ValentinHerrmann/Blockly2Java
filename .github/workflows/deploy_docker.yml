name: Build and Deploy Docker image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'production' || 'b2j-dev' }}
      url: https://${{ vars.DEPLOY_HOST }}

    permissions:
      contents: read
      packages: write
      
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: env.DOCKER_REGISTRY != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image_tags
        run: |
          set -e
          REGISTRY="${{ vars.DOCKER_REGISTRY }}"
          IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_NAME" ]; then
            echo "ERROR: DOCKER_REGISTRY and DOCKER_IMAGE vars must be set" >&2
            exit 1
          fi
          BASE_IMAGE="$REGISTRY/$OWNER/$IMAGE_NAME"
          SHA_TAG="$BASE_IMAGE:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            DEPLOY_TAG="$BASE_IMAGE:$RELEASE_TAG"
            LATEST_TAG="$BASE_IMAGE:latest"
            echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
            echo "extra_tags=$DEPLOY_TAG $LATEST_TAG" >> $GITHUB_OUTPUT
          else
            DEPLOY_TAG="$BASE_IMAGE:dev"
            echo "deploy_tag=$DEPLOY_TAG" >> $GITHUB_OUTPUT
            echo "extra_tags=$DEPLOY_TAG" >> $GITHUB_OUTPUT
          fi
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          set -e
          CORS_PROXY_URL="${CORS_PROXY_URL}"
          if [ -z "$CORS_PROXY_URL" ]; then
            echo "ERROR: secret CORS_PROXY_URL must be set for Docker deployments" >&2
            exit 1
          fi
          SHA_TAG="${{ steps.image_tags.outputs.sha_tag }}"
          BUILD_ARGS="-t $SHA_TAG"
          for TAG in ${{ steps.image_tags.outputs.extra_tags }}; do
            BUILD_ARGS="$BUILD_ARGS -t $TAG"
          done
          DOCKER_BUILDKIT=1 docker build --pull --no-cache --build-arg SKIP_ONLINE_IDE_BUILD=1 --build-arg CORS_PROXY_URL="$CORS_PROXY_URL" $BUILD_ARGS .
          docker push "$SHA_TAG"
          for TAG in ${{ steps.image_tags.outputs.extra_tags }}; do
            docker push "$TAG"
          done

      - name: Deploy on server via SSH (pull image and restart container)
        if: github.event_name == 'release'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            REGISTRY="${{ vars.DOCKER_REGISTRY }}"
            IMAGE_NAME="${{ vars.DOCKER_IMAGE }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Quick remote checks to validate SSH session and environment
            echo "SSH connected to: $(hostname)";
            uname -a || true
            if command -v docker >/dev/null 2>&1; then docker --version || true; else echo "docker not installed"; fi
            if command -v nginx >/dev/null 2>&1; then nginx -v || true; else echo "nginx not installed yet"; fi

            if [ -z "$REGISTRY" ]; then
              echo "ERROR: var DOCKER_REGISTRY must be set" >&2
              exit 1
            fi
            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: var DOCKER_IMAGE must be set" >&2
              exit 1
            fi

            CONTAINER_NAME="${{ vars.DEPLOY_CONTAINER_NAME }}"
            if [ -z "$CONTAINER_NAME" ]; then
              echo "WARNING: repository variable DEPLOY_CONTAINER_NAME not set — using default 'blockly2java'" >&2
              CONTAINER_NAME=blockly2java
            fi

            # Pull the deploy tag (either :dev or :<release-tag>)
            DEPLOY_IMAGE="${{ steps.image_tags.outputs.deploy_tag }}"
            docker pull "$DEPLOY_IMAGE" || true

            # Stop and remove existing container
            if docker ps -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker stop "$CONTAINER_NAME" || true
            fi
            if docker ps -a -q --filter "name=$CONTAINER_NAME" | grep -q .; then
              docker rm "$CONTAINER_NAME" || true
            fi

            # Choose internal port
            PORT="${{ vars.DEPLOY_APP_PORT }}"
            PORT=${PORT:-8080}

            # Run container bound to localhost (pass PORT env so app respects mapping)
            docker run -d --restart unless-stopped --name "$CONTAINER_NAME" -p 127.0.0.1:${PORT}:${PORT} -e NODE_ENV=production -e PORT=${PORT} "$DEPLOY_IMAGE"

            # Health check: verify the app inside the container responds on the chosen port
            APP_OK=0
            for i in $(seq 1 10); do
              if curl -sSf http://127.0.0.1:${PORT}/ >/dev/null 2>&1; then
                APP_OK=1; break
              fi
              sleep 1
            done
            if [ "$APP_OK" -ne 1 ]; then
              echo "ERROR: app did not respond on container port ${PORT}" >&2
              echo "=== last 500 lines of container logs ===" >&2
              docker logs --tail 500 "$CONTAINER_NAME" >&2 || true
              echo "=== container status ===" >&2
              docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
              exit 1
            fi
            docker system prune -af
            # nginx configuration and external proxying are managed outside this workflow
