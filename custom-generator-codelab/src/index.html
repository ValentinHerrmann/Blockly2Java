<!DOCTYPE html>
 <html>
   <head>
     <meta charset="utf-8" />
     <title>Blockly</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>

    <!-- favicon.ico — broadest fallback (IE, older Android WebView, bots) -->
    <link rel="shortcut icon" href="assets/favicon.ico">
    <!-- PNG icons — used by Chrome, Edge, Firefox and most Chromium browsers -->
    <link rel="icon" href="assets/icon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="assets/icon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="assets/icon-48x48.png" sizes="48x48" type="image/png">
    <link rel="icon" href="assets/icon-96x96.png" sizes="96x96" type="image/png">
    <link rel="icon" href="assets/icon-192x192.png" sizes="192x192" type="image/png">
    <!-- SVG icon — modern desktop browsers (Chrome 80+, Firefox 41+, Edge 79+) -->
    <link rel="icon" href="assets/B2J.svg" type="image/svg+xml">
    <!-- Apple touch icon — iOS/iPadOS Safari home screen shortcut (must be PNG) -->
    <link rel="apple-touch-icon" href="assets/icon-180x180.png" sizes="180x180">
    <!-- Web App Manifest — drives Chrome/Android "Add to Home Screen" & PWA install -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blockly2Java">

    <!-- online-ide-embedded.js is a Vite bundle that includes all dependencies
         (monaco-editor, p5, pako, jszip, upng, markdownit, howler, fonts) -->
    <script type="module" crossorigin src="online-ide-embedded.js"></script>
    <link rel="stylesheet" href="online-ide-embedded.css">
  </head>




  <body>
    <!-- Pre-loader splash screen -->
    <div id="preloader" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff;opacity:1;transition:opacity 0.4s ease;">
      <img src="assets/B2J.svg" alt="Blockly2Java" style="width:min(500px,50vmin);height:auto;" />
    </div>

    <!-- Reusable icon definitions (referenced via <use href="#..."> everywhere) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <defs>
        <!-- Java coffee-cup icon -->
        <symbol id="icon-java" viewBox="0 0 18 18">
          <!-- steam wisps -->
          <path d="M6.5 5.5C5.6 4 6.2 2.6 7.5 2C8.8 1.4 8.2 0 8.2 0" stroke="#E76F00" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path d="M10.5 5.5C9.6 4 10.2 2.6 11.5 2C12.8 1.4 12.2 0 12.2 0" stroke="#E76F00" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <!-- rim -->
          <rect x="1" y="6" width="14" height="2" rx="1" fill="#F08030"/>
          <!-- body -->
          <path d="M2 8L3.2 14.8Q3.7 16.5 8 16.5Q12.3 16.5 12.8 14.8L14 8Z" fill="#E76F00"/>
          <!-- handle -->
          <path d="M14 10Q17.5 10 17.5 12Q17.5 14 14 14" stroke="#C55010" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <!-- Official Blockly logo loaded from file -->
        <!-- chevron-left: used for "collapse left" and "expand right" -->
        <path id="chev-left" d="M8 2L4 6L8 10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- chevron-right: used for "collapse right" and "expand left" -->
        <path id="chev-right" d="M4 2L8 6L4 10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Git clone icon (arrow into tray) -->
        <symbol id="icon-git-clone" viewBox="0 0 16 16">
          <path d="M8 1v8M5 6l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M3 12v2h10v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </symbol>
        <!-- Git pull icon (down-arrow) -->
        <symbol id="icon-git-pull" viewBox="0 0 16 16">
          <path d="M8 2v10M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </symbol>
        <!-- Git push icon (up-arrow with base line) -->
        <symbol id="icon-git-push" viewBox="0 0 16 16">
          <path d="M8 14V4M5 7l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M3 14h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <div id="pageContainer">
        <!-- Tab bar shown only in narrow mode -->
        <div id="narrowTabBar" class="narrow-tab-bar">
          <button class="narrow-tab narrow-tab--active" data-pane="left">
              <img class="tab-icon" src="assets/logo_only.svg" width="24" height="24" aria-hidden="true" alt="">
              <span>Blockly</span>
          </button>
          <button class="narrow-tab" data-pane="right">
              <svg class="tab-icon" width="24" height="24" viewBox="0 0 18 18" aria-hidden="true"><use href="#icon-java"/></svg>
              <span>Java IDE</span>
          </button>
        </div>
        <!-- Content wrapper: git sidebar + panes -->
        <div id="contentWrapper" class="content-wrapper">

            <!-- ── Git sidebar ─────────────────────────────────────── -->
            <nav id="gitSidebar" class="git-sidebar" aria-label="Git">
                <div class="git-sidebar__header">
                    <svg class="git-sidebar__logo" width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
                        <circle cx="8" cy="3" r="1.8" stroke="currentColor" stroke-width="1.3" fill="none"/>
                        <circle cx="8" cy="13" r="1.8" stroke="currentColor" stroke-width="1.3" fill="none"/>
                        <line x1="8" y1="4.8" x2="8" y2="11.2" stroke="currentColor" stroke-width="1.3"/>
                    </svg>
                    <span>Git</span>
                </div>
                <div class="git-sidebar__actions">
                    <button id="gitCloneBtn" class="git-sidebar-btn" title="Repository klonen" aria-label="Repository klonen">
                        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-git-clone"/></svg>
                        <span>Clone</span>
                    </button>
                    <button id="gitPullBtn" class="git-sidebar-btn" title="Pull" aria-label="Pull" disabled>
                        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-git-pull"/></svg>
                        <span>Pull</span>
                    </button>
                    <button id="gitPushBtn" class="git-sidebar-btn" title="Commit &amp; Push" aria-label="Commit &amp; Push" disabled>
                        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><use href="#icon-git-push"/></svg>
                        <span>Push</span>
                    </button>
                    <div class="git-sidebar__info">
                        <button id="gitInfoBtn" class="git-sidebar-btn git-sidebar-btn--info" title="Repository-Info" aria-label="Repository-Info" disabled>
                            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="8" cy="8" r="6.5"/>
                                <line x1="8" y1="7" x2="8" y2="11.5" stroke-linecap="round"/>
                                <circle cx="8" cy="4.8" r="0.7" fill="currentColor" stroke="none"/>
                            </svg>
                            <span>Info</span>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- ── Panes ──────────────────────────────────────────── -->
            <div id="panesContainer" class="panes-container">
            <div id="leftPane" class="split-pane split-pane--left">
                <div class="pane-header" data-pane="left">
                    <div class="pane-header-identity">
                        <img class="pane-icon" src="assets/logo_only.svg" width="24" height="24" aria-hidden="true" alt="">
                        <span class="pane-title">Blockly</span>
                    </div>
                    <div class="pane-header-actions">
                        <button class="pane-collapse-btn" data-pane="left" title="Leiste einklappen" aria-label="Leiste einklappen">
                            <svg class="chev-svg" width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" aria-hidden="true"><use href="#chev-left"/></svg>
                        </button>
                    </div>
                </div>
                <div class="pane-content">
                    <div id="blocklyDiv" class="content-container content-container--constrained"></div>
                </div>
            </div>
            <div id="divider" class="split-divider"></div>
            <div id="rightPane" class="split-pane split-pane--right">
                <div class="pane-header" data-pane="right">
                    <button class="pane-collapse-btn" data-pane="right" title="Leiste einklappen" aria-label="Leiste einklappen">
                        <svg class="chev-svg" width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" aria-hidden="true"><use href="#chev-right"/></svg>
                    </button>
                    <div class="pane-header-identity">
                        <svg class="pane-icon" width="24" height="24" viewBox="0 0 18 18" aria-hidden="true"><use href="#icon-java"/></svg>
                        <span class="pane-title">Java IDE</span>
                    </div>
                </div>
                <div class="pane-content">
                    <!-- Top section: monaco editor fills this area -->
                    <div id="ideTopSection" class="inner-split-pane">
                        <div id="ide" class="java-online"
                          data-java-online="{
                          'id': 'Java',
                          'speed': 20,
                          'withBottomPanel': true ,
                          'withPCode': false ,
                          'withConsole': true ,
                          'withFileList': true ,
                          'withErrorList': true,
                          'enableFileAccess': true,
                          'withClassDiagram': false,
                          'hideUnitTests': true,
                          'hideWorkspaceFilesMng': true,
                          'simplifyDebugger': true,
                          'hideResetButton': true,
                          'settings': {
                            'editor.hoverVerbosity.showHelpOnKeywordsAndOperators': true,
                            'editor.hoverVerbosity.showMethodDeclaration': 'declarationsAndComments',
                            'editor.hoverVerbosity.showClassDeclaration':  'declarationsAndComments',
                            'editor.contextSensitiveHelp.StructureStatements' :'true',
                            'editor.contextSensitiveHelp.ParameterHints' :'true',
                            'editor.autoClosingBrackets': 'always',
                            'editor.autoClosingQuotes': 'always',
                            'editor.autoSemicolons': true,
                            'compiler.shadowedSymbolErrorLevel': 'ignore'
                          }
                          }">
                          <script type="text/plain" title="Main.java" data-type="java">
                          </script>
                        </div>
                    </div>
                    <!-- B2J-managed horizontal divider between editor and bottom panel -->
                    <div id="rightHorizDivider" class="right-horiz-divider" title="Ziehen zum Anpassen"></div>
                    <!-- Bottom section: receives .joe_bottomDiv after IDE init -->
                    <div id="ideBottomSection" class="joeCssFence inner-split-pane"></div>
                </div>
            </div>
            </div>
        </div><!-- /#contentWrapper -->
        <footer id="appFooter" class="app-footer">
            <div class="app-footer__left"><a style="color: var(--text-primary);" href="https://valentin-herrmann.com" target="_blank" rel="noopener noreferrer">&copy; Valentin Herrmann 2026</a></div>
            <div class="app-footer__center"><img src="assets/B2J_flat.svg" alt="Blockly2Java" class="app-footer__logo"></div>
            <div class="app-footer__right">Powered by <a style="color: var(--text-primary);" href="https://github.com/martin-pabst/Online-IDE-new-compiler" target="_blank" rel="noopener noreferrer">OnlineIDE</a> & <a style="color: var(--text-primary);" href="https://developers.google.com/blockly" target="_blank" rel="noopener noreferrer">Blockly</a></div>
        </footer>
    </div>
  </body>
    <script>
      (function () {
        function hidePreloader() {
          var pre = document.getElementById('preloader');
          if (!pre) return;
          pre.classList.add('preloader--hidden');
          // remove element after fade; also guard with a timeout in case transitionend never fires
          var removed = false;
          function remove() { if (!removed && pre.parentNode) { removed = true; pre.remove(); } }
          pre.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 600);
        }
        // Fire as soon as the DOM is interactive; fall back to a hard 5 s timeout.
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hidePreloader);
        } else {
          hidePreloader();
        }
        setTimeout(hidePreloader, 5000);
      })();
    </script>
</html>
