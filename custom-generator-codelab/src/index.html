<!DOCTYPE html>
 <html>
   <head>
     <meta charset="utf-8" />
     <title>Blockly</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link rel="preload" href="lib/monaco-editor/dev/vs/editor/editor.main.js" as="script">
    <link rel="preload" href="lib/monaco-editor/dev/vs/editor/editor.main.nls.de.js" as="script">

    <link rel='stylesheet' type='text/css' media='screen' href='assets/fonts/fonts.css'>
    <link rel="icon" href="assets/B2J.svg" type="image/svg+xml">
    <link rel="icon" href="assets/B2J.svg" sizes="32x32" type="image/svg+xml">
    <link rel="icon" href="assets/B2J.svg" sizes="16x16" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/B2J.svg" sizes="180x180" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1f2937">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blockly2Java">
    
    <script src="lib/p5.js/p5.js"></script>    
    <script src="lib/pako/pako.js"></script>
    <script src="lib/jszip/jszip.js"></script>
    <script src="lib/upng/UPNG.js"></script>

    <script src="lib/markdownit/markdownit.min.js"></script>
    <script src="lib/monaco-editor/dev/vs/loader.js"></script>
    <script src="lib/howler/howler.core.min.js"></script>

    <script type="module" crossorigin src="online-ide-embedded.js"></script>
    <link rel="stylesheet" href="online-ide-embedded.css">
  </head>




  <body>
    <!-- Pre-loader splash screen -->
    <div id="preloader" aria-hidden="true" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#fff;opacity:1;transition:opacity 0.4s ease;">
      <img src="assets/B2J.svg" alt="Blockly2Java" style="width:min(500px,50vmin);height:auto;" />
    </div>

    <!-- Reusable icon definitions (referenced via <use href="#..."> everywhere) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <defs>
        <!-- Java coffee-cup icon -->
        <symbol id="icon-java" viewBox="0 0 18 18">
          <!-- steam wisps -->
          <path d="M6.5 5.5C5.6 4 6.2 2.6 7.5 2C8.8 1.4 8.2 0 8.2 0" stroke="#E76F00" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path d="M10.5 5.5C9.6 4 10.2 2.6 11.5 2C12.8 1.4 12.2 0 12.2 0" stroke="#E76F00" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <!-- rim -->
          <rect x="1" y="6" width="14" height="2" rx="1" fill="#F08030"/>
          <!-- body -->
          <path d="M2 8L3.2 14.8Q3.7 16.5 8 16.5Q12.3 16.5 12.8 14.8L14 8Z" fill="#E76F00"/>
          <!-- handle -->
          <path d="M14 10Q17.5 10 17.5 12Q17.5 14 14 14" stroke="#C55010" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <!-- Official Blockly logo loaded from file -->
        <!-- chevron-left: used for "collapse left" and "expand right" -->
        <path id="chev-left" d="M8 2L4 6L8 10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- chevron-right: used for "collapse right" and "expand left" -->
        <path id="chev-right" d="M4 2L8 6L4 10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </defs>
    </svg>

    <div id="pageContainer">
        <!-- Tab bar shown only in narrow mode -->
        <div id="narrowTabBar" class="narrow-tab-bar">
          <button class="narrow-tab narrow-tab--active" data-pane="left">
              <img class="tab-icon" src="assets/logo_only.svg" width="24" height="24" aria-hidden="true" alt="">
              <span>Blockly</span>
          </button>
          <button class="narrow-tab" data-pane="right">
              <svg class="tab-icon" width="24" height="24" viewBox="0 0 18 18" aria-hidden="true"><use href="#icon-java"/></svg>
              <span>Java IDE</span>
          </button>
        </div>
        <!-- Horizontal pane container -->
        <div id="panesContainer" class="panes-container">
            <div id="leftPane" class="split-pane split-pane--left">
                <div class="pane-header" data-pane="left">
                    <div class="pane-header-identity">
                        <img class="pane-icon" src="assets/logo_only.svg" width="24" height="24" aria-hidden="true" alt="">
                        <span class="pane-title">Blockly</span>
                    </div>
                    <button class="pane-collapse-btn" data-pane="left" title="Leiste einklappen" aria-label="Leiste einklappen">
                        <svg class="chev-svg" width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" aria-hidden="true"><use href="#chev-left"/></svg>
                    </button>
                </div>
                <div class="pane-content">
                    <div id="blocklyDiv" class="content-container content-container--constrained"></div>
                </div>
            </div>
            <div id="divider" class="split-divider"></div>
            <div id="rightPane" class="split-pane split-pane--right">
                <div class="pane-header" data-pane="right">
                    <button class="pane-collapse-btn" data-pane="right" title="Leiste einklappen" aria-label="Leiste einklappen">
                        <svg class="chev-svg" width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" aria-hidden="true"><use href="#chev-right"/></svg>
                    </button>
                    <div class="pane-header-identity">
                        <svg class="pane-icon" width="24" height="24" viewBox="0 0 18 18" aria-hidden="true"><use href="#icon-java"/></svg>
                        <span class="pane-title">Java IDE</span>
                    </div>
                </div>
                <div class="pane-content">
                    <div id="ide" class="java-online"
                      data-java-online="{
                      'id': 'Java',
                      'speed': 10,
                      'withBottomPanel': true ,
                      'withPCode': false ,
                      'withConsole': true ,
                      'withFileList': true ,
                      'withErrorList': true,
                      'enableFileAccess': true,
                      'withClassDiagram': false,
                      'hideUnitTests': true,
                      'hideWorkspaceFilesMng': true,
                      'simplifyDebugger': true,
                      'hideResetButton': true,
                      'settings': {
                        'editor.hoverVerbosity.showHelpOnKeywordsAndOperators': true,
                        'editor.hoverVerbosity.showMethodDeclaration': 'declarationsAndComments',   
                        'editor.hoverVerbosity.showClassDeclaration':  'declarationsAndComments',
                        'editor.contextSensitiveHelp.StructureStatements' :'true',
                        'editor.contextSensitiveHelp.ParameterHints' :'true',
                        'editor.autoClosingBrackets': 'always',
                        'editor.autoClosingQuotes': 'always',
                        'editor.autoSemicolons': true
                      }
                      }">
                      <script type="text/plain" title="Main.java" data-type="java">
                      </script>
                    </div>
                </div>
            </div>
        </div>
        <footer id="appFooter" class="app-footer">
            <div class="app-footer__left"><a style="color: var(--text-primary);" href="https://valentin-herrmann.com" target="blank" rel="noopener">&copy; Valentin Herrmann 2026</a></div>
            <div class="app-footer__center"><img src="assets/B2J_flat.svg" alt="Blockly2Java" class="app-footer__logo"></div>
            <div class="app-footer__right">Powered by Martin Pabst's <a style="color: var(--text-primary);" href="https://github.com/martin-pabst/Online-IDE-new-compiler" target="_blank" rel="noopener">OnlineIDE</a> & Google's <a style="color: var(--text-primary);" href="https://developers.google.com/blockly" target="_blank" rel="noopener">Blockly Framework</a></div>
        </footer>
    </div>
  </body>
    <script>
      (function () {
        function hidePreloader() {
          var pre = document.getElementById('preloader');
          if (!pre) return;
          pre.classList.add('preloader--hidden');
          // remove element after fade; also guard with a timeout in case transitionend never fires
          var removed = false;
          function remove() { if (!removed && pre.parentNode) { removed = true; pre.remove(); } }
          pre.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 600);
        }
        // Fire as soon as the DOM is interactive; fall back to a hard 5 s timeout.
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hidePreloader);
        } else {
          hidePreloader();
        }
        setTimeout(hidePreloader, 5000);
      })();
    </script>
</html>
